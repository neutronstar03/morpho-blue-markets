name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7.0.1

      - name: Use repository Node runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check lint
        run: bun run lint:check

      - name: Check types
        run: bun run typecheck

      - name: Run offline unit tests
        run: bun run test:unit

      - name: Run UI tests
        run: bun run test:ui:run

      - name: Build project
        run: bun run build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}

      - name: Copy Cloudflare Pages Functions into build output
        run: cp -r functions ./build/client/functions

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.81.1
          command: pages deploy ./build/client --project-name=mbm --branch=main
